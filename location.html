<script>
  (function () {
    var hospital = {
      name: '서울더원마취통증의학과의원',
      // 판교우림더블유시티 인근 좌표입니다. 실제 핀 위치가 조금 다르면 아래 lat/lng만 조정하면 됩니다.
      lat: 37.400942,
      lng: 127.103546
    };

    function showMapError() {
      var mapEl = document.getElementById('naver-map');
      if (!mapEl) return;
      mapEl.innerHTML = '<div class="map-fallback">네이버 지도 API 로딩에 실패했습니다.<br>네이버 클라우드 콘솔의 Web 서비스 URL 등록 여부를 확인해 주세요.<a class="btn btn-navy" href="https://map.naver.com/p/search/서울더원마취통증의학과의원" target="_blank" rel="noopener">네이버 지도 · 길찾기 →</a></div>';
    }

    function initNaverMap() {
      var mapEl = document.getElementById('naver-map');
      if (!mapEl) return;
      if (!window.naver || !naver.maps) { showMapError(); return; }

      var position = new naver.maps.LatLng(hospital.lat, hospital.lng);
      var map = new naver.maps.Map(mapEl, {
        center: position,
        zoom: 17,
        minZoom: 8,
        zoomControl: true,
        zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT },
        scaleControl: false,
        logoControl: true,
        mapDataControl: false
      });

      var marker = new naver.maps.Marker({
        position: position,
        map: map,
        title: hospital.name
      });

      var infoWindow = new naver.maps.InfoWindow({
        content: '<div style="padding:12px 16px;min-width:220px;font-family:Pretendard,Arial,sans-serif;line-height:1.55">' +
          '<strong style="display:block;color:#152a5e;font-size:14px">서울더원마취통증의학과의원</strong>' +
          '<span style="display:block;margin-top:4px;color:#566070;font-size:12px">판교우림더블유시티 2층 218, 223호</span>' +
        '</div>'
      });

      infoWindow.open(map, marker);
      naver.maps.Event.addListener(marker, 'click', function () {
        if (infoWindow.getMap()) infoWindow.close();
        else infoWindow.open(map, marker);
      });

      setTimeout(function () {
        naver.maps.Event.trigger(map, 'resize');
        map.setCenter(position);
      }, 250);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNaverMap);
    else initNaverMap();
  })();
</script>
<script>
  (function () {
    function flash(el, txt, orig) {
      var s = el.querySelector('.cp-state') || el.querySelector('.cp-ic');
      var old = s ? s.textContent : '';
      if (el.classList.contains('copy-chip')) { el.classList.add('done'); }
      if (s) s.textContent = txt;
      setTimeout(function () { if (s) s.textContent = old; el.classList.remove('done'); }, 1500);
    }
    function copy(t, el) {
      if (navigator.clipboard) { navigator.clipboard.writeText(t).catch(function(){}); }
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    document.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        copy(btn.getAttribute('data-copy'), btn);
        if (btn.classList.contains('copy-line')) flash(btn, '✓ 복사되었습니다');
        else flash(btn, '✓');
      });
    });
  })();
</script>
