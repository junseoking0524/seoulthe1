<style>
  .map-wrap{position:relative}
  .copy-line:hover{border-color:var(--blue);background:#fff}
  .copy-chip{padding:10px 16px;background:#fff;border:1.5px solid #d6ddec;border-radius:24px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--blue);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .copy-chip:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
  .copy-chip.done{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
  .busno{padding:6px 14px;background:var(--blue);color:#fff;border-radius:20px;font-size:13px;font-weight:800;letter-spacing:.02em}
  .map-marker{position:relative;width:248px;text-align:center;transform:translateY(-4px);font-family:Pretendard,'NanumBarunGothic',sans-serif;pointer-events:none}
  .map-marker-label{display:inline-block;position:relative;min-width:218px;padding:10px 15px 11px;background:#fff;border:2px solid #1b3f96;border-radius:14px;box-shadow:0 10px 26px rgba(13,38,86,.22);line-height:1.25;white-space:nowrap}
  .map-marker-label:after{content:'';position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:#fff;border-right:2px solid #1b3f96;border-bottom:2px solid #1b3f96;transform:translateX(-50%) rotate(45deg)}
  .map-marker-place{font-size:12px;font-weight:800;color:#66758e;letter-spacing:-.02em}
  .map-marker-name{margin-top:3px;font-size:15px;font-weight:900;color:#11327a;letter-spacing:-.04em}
  .map-marker-pin{position:relative;width:26px;height:26px;margin:12px auto 0;background:var(--orange,#f26522);border:3px solid #fff;border-radius:50% 50% 50% 0;box-shadow:0 5px 13px rgba(242,101,34,.35);transform:rotate(-45deg)}
  .map-marker-pin span{position:absolute;left:50%;top:50%;width:7px;height:7px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
  @media (max-width:640px){.map-marker{width:214px}.map-marker-label{min-width:184px;padding:9px 12px}.map-marker-place{font-size:11px}.map-marker-name{font-size:13px}}
</style>
<script>
  (function () {
    function flash(el, txt, orig) {
      var s = el.querySelector('.cp-state') || el.querySelector('.cp-ic');
      var old = s ? s.textContent : '';
      if (el.classList.contains('copy-chip')) { el.classList.add('done'); }
      if (s) s.textContent = txt;
      setTimeout(function () { if (s) s.textContent = old; el.classList.remove('done'); }, 1500);
    }
    function copy(t, el) {
      if (navigator.clipboard) { navigator.clipboard.writeText(t).catch(function(){}); }
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    document.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        copy(btn.getAttribute('data-copy'), btn);
        if (btn.classList.contains('copy-line')) flash(btn, '✓ 복사되었습니다');
        else flash(btn, '✓');
      });
    });
  })();
</script>
<!-- 네이버 지도 API (Client ID) -->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=4qswvhm869"></script>
<script>
  (function () {
    var LAT = 37.40199, LNG = 127.10666, NAME = '서울더원마취통증의학과의원';
    var fb = document.querySelector('.map-fallback');
    function showFB(){ if (fb) fb.style.display = 'flex'; }
    function hideFB(){ if (fb) fb.style.display = 'none'; }
    window.navermap_authFailure = showFB;
    function initMap() {
      if (!(window.naver && naver.maps && naver.maps.Map)) { showFB(); return; }
      try {
        var pos = new naver.maps.LatLng(LAT, LNG);
        var map = new naver.maps.Map('naver-map', {
          center: pos,
          zoom: 17,
          zoomControl: true,
          zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER }
        });
        var markerHtml = [
          '<div class="map-marker" aria-label="서울더원마취통증의학과의원 위치">',
          '  <div class="map-marker-label">',
          '    <div class="map-marker-place">판교우림더블유시티 2층 218·223호</div>',
          '    <div class="map-marker-name">서울더원마취통증의학과의원</div>',
          '  </div>',
          '  <div class="map-marker-pin"><span></span></div>',
          '</div>'
        ].join('');
        var marker = new naver.maps.Marker({
          position: pos,
          map: map,
          title: NAME + ' · 판교우림더블유시티 2층 218·223호',
          icon: {
            content: markerHtml,
            size: new naver.maps.Size(248, 96),
            anchor: new naver.maps.Point(124, 92)
          }
        });
        var infoWindow = new naver.maps.InfoWindow({
          content: '<div style="padding:12px 16px;font-family:Pretendard, sans-serif;line-height:1.45;min-width:210px"><strong style="display:block;color:#11327a;font-size:15px">서울더원마취통증의학과의원</strong><span style="display:block;margin-top:4px;color:#4f5f78;font-size:13px">판교우림더블유시티 2층 218·223호</span></div>',
          borderWidth: 0,
          backgroundColor: 'transparent',
          anchorSize: new naver.maps.Size(0, 0),
          pixelOffset: new naver.maps.Point(0, -102)
        });
        naver.maps.Event.addListener(marker, 'click', function () {
          if (infoWindow.getMap()) infoWindow.close();
          else infoWindow.open(map, marker);
        });
        hideFB();
      } catch (e) { showFB(); }
    }
    if (window.naver && naver.maps) { initMap(); }
    else { window.addEventListener('load', initMap); }

    // 길찾기: 폰에 네이버 지도 앱이 있으면 앱으로 연결, 없으면 웹으로
    var web = 'https://map.naver.com/p/search/' + encodeURIComponent(NAME);
    var btn = document.getElementById('routeBtn');
    if (btn) btn.addEventListener('click', function () {
      var isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isMobile) {
        var app = 'nmap://place?lat=' + LAT + '&lng=' + LNG + '&name=' + encodeURIComponent(NAME) + '&appname=com.seoulthe1.web';
        var t = Date.now();
        setTimeout(function () { if (Date.now() - t < 1700) window.location.href = web; }, 1300);
        window.location.href = app;
      } else {
        window.open(web, '_blank', 'noopener');
      }
    });
  })();
</script>
